# Brand normalization rules
# Maps merchant name patterns to canonical brand names for grouping
# Patterns are matched in order, first match wins

brandRules:
  - pattern: "(?i)^amazon"
    canonical: AMAZON
    priority: 10
  - pattern: "(?i)^amzn"
    canonical: AMAZON
    priority: 11
  - pattern: "(?i)^walmart"
    canonical: walmart
    priority: 20
  - pattern: "(?i)^wm\s"
    canonical: walmart
    priority: 21
  - pattern: "(?i)^costco"
    canonical: costco
    priority: 30
  - pattern: "(?i)^target"
    canonical: target
    priority: 40
  - pattern: "(?i)^best\s+buy"
    canonical: best buy
    priority: 50
  - pattern: "(?i)^bestbuy"
    canonical: best buy
    priority: 51
  - pattern: "(?i)^apple"
    canonical: apple
    priority: 60
  - pattern: "(?i)^itunes"
    canonical: apple
    priority: 61
  - pattern: "(?i)^google"
    canonical: google
    priority: 70
  - pattern: "(?i)^youtube"
    canonical: google
    priority: 71
  - pattern: "(?i)^microsoft"
    canonical: microsoft
    priority: 80
  - pattern: "(?i)^msft"
    canonical: microsoft
    priority: 81
  - pattern: "(?i)^netflix"
    canonical: netflix
    priority: 90
  - pattern: "(?i)^spotify"
    canonical: spotify
    priority: 100
  - pattern: "(?i)^uber"
    canonical: uber
    priority: 110
  - pattern: "(?i)^lyft"
    canonical: lyft
    priority: 120
  - pattern: "(?i)^tim hortons"
    canonical: TIM HORTONS
    priority: 130
  - pattern: "(?i)^tims\\b"
    canonical: TIM HORTONS
    priority: 131
  - pattern: "(?i)^timhortons"
    canonical: TIM HORTONS
    priority: 132
  - pattern: "(?i)^wal-mart"
    canonical: WALMART
    priority: 133
  - pattern: "(?i)^lite bite"
    canonical: lite bite
    priority: 140
  - pattern: "(?i)^freedom mobile"
    canonical: freedom mobile
    priority: 150
  - pattern: "(?i)^presto"
    canonical: presto
    priority: 160
  - pattern: "(?i)^metro"
    canonical: metro
    priority: 170
  - pattern: "(?i)^sobeys"
    canonical: sobeys
    priority: 180
  - pattern: "(?i)^loblaws"
    canonical: loblaws
    priority: 190
  - pattern: "(?i)^shoppers drug mart"
    canonical: shoppers drug mart
    priority: 200
