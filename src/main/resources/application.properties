spring.application.name=financial-transactions
spring.jpa.generate-ddl=true
# DataSource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/financial_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.show_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

analytics.refresh.cron=0 30 2 * * ?
analytics.forecast.horizon-months=3
analytics.insights.max-results=20
analytics.backfill-on-start=false
analytics.snapshot.months=24

# Transaction exclusion patterns (comma-separated)
transaction.exclusion.patterns=PAYMENT RECEIVED - THANK YOU

# Splitwise integration
splitwise.polling.enabled=true
splitwise.polling.cron=0 0 * * * ?
splitwise.initial-lookback-days=90
splitwise.poll-overlap-minutes=5
splitwise.page-size=50
splitwise.user-delay-ms=200
splitwise.api.base-url=https://secure.splitwise.com/api/v3.0
splitwise.api.connect-timeout-ms=5000
splitwise.api.read-timeout-ms=30000
splitwise.api.max-retries=3
splitwise.credentials.key=${SPLITWISE_CREDENTIALS_KEY:}
